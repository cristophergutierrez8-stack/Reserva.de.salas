{% extends 'base.html' %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4 shadow-lg border-0">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow" style="width: 65px; height: 65px;">
                    <i class="bi bi-person-lock fs-1"></i>
                </div>
                <h4 class="fw-bold mb-1">Acceso al Sistema</h4>
                <p class="text-muted small mb-0">Sistema de Reserva de Salas Institucional</p>
            </div>

            <form method="post" action="{% url 'login' %}" id="loginForm">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label font-weight-bold">Usuario</label>
                    {{ form.username }}
                </div>
                <div class="mb-4">
                    <label for="id_password" class="form-label font-weight-bold">Contraseña</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center">
                <p class="mb-2 text-muted small"><strong>Completar usuario de prueba:</strong></p>
                <div class="d-grid gap-2">
                    <button type="button" onclick="fillUsername('alumno1')" class="btn btn-sm btn-outline-primary text-start">
                        <i class="bi bi-person-check-fill me-2"></i><strong>Alumno 1:</strong> <code>alumno1</code>
                    </button>
                    <button type="button" onclick="fillUsername('secretaria')" class="btn btn-sm btn-outline-warning text-dark text-start">
                        <i class="bi bi-person-badge-fill me-2"></i><strong>Secretaría:</strong> <code>secretaria</code>
                    </button>
                    <button type="button" onclick="fillUsername('admin')" class="btn btn-sm btn-outline-dark text-start">
                        <i class="bi bi-gear-fill me-2"></i><strong>Administrador:</strong> <code>admin</code>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillUsername(username) {
    var usernameInput = document.getElementById('id_username');
    if (usernameInput) {
        usernameInput.value = username;
        usernameInput.focus();
    }
}
</script>
{% endblock %}
